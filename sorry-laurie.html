<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I'm Sorry 🥺</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(135deg,#e9defa 0%,#fcd5e5 55%,#ffe6cf 100%);display:flex;align-items:center;justify-content:center;color:#4a1d3d}
.bg{position:fixed;bottom:-40px;opacity:.5;animation:up linear forwards;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-115vh) rotate(20deg);opacity:0}}
.screen{position:relative;z-index:2;width:min(92vw,460px);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:28px;padding:36px 26px 32px;text-align:center;box-shadow:0 20px 50px rgba(120,50,110,.25);display:none;animation:appear .6s ease both}
.screen.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.big{font-size:60px;display:inline-block;margin-bottom:8px;animation:wob 2.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.1)}}
h1{font-size:28px;margin-bottom:10px}
.msg{font-size:17px;line-height:1.55;min-height:112px;margin-bottom:18px}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;transition:transform .15s,box-shadow .2s}
.main{background:linear-gradient(135deg,#a37bff,#7c4dff);color:#fff;font-size:18px;padding:14px 38px;box-shadow:0 8px 20px rgba(124,77,255,.4);opacity:0;pointer-events:none;transition:opacity .6s}
.main.on{opacity:1;pointer-events:auto}
.q{font-size:30px;line-height:1.25;margin:4px 0 6px}
.sub{font-size:15px;opacity:.7;margin-bottom:22px}
.row{height:76px;display:flex;justify-content:center;align-items:center;gap:22px}
#yes{background:linear-gradient(135deg,#3ddc84,#1fb866);color:#fff;font-size:19px;padding:14px 30px;box-shadow:0 8px 20px rgba(31,184,102,.4)}
#no{background:#7a7a8c;color:#fff;font-size:18px;padding:12px 30px;transition:left .25s,top .25s}
#no.run{position:fixed;z-index:50}
.hint{margin-top:16px;font-size:14px;opacity:.7;min-height:20px}
.line{opacity:0;transform:translateY(14px) scale(.9);transition:all .8s cubic-bezier(.2,1.2,.4,1)}
.line.show{opacity:1;transform:none}
.particle{position:fixed;pointer-events:none;z-index:100}
.ring{position:fixed;pointer-events:none;z-index:99;border-radius:50%;border:4px solid #fff;width:50px;height:50px;transform:translate(-50%,-50%) scale(0);animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(14);opacity:0;border-width:1px}}
.fall{position:fixed;top:-50px;pointer-events:none;z-index:90;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--rot));opacity:.9}}
.stage{position:fixed;inset:0;display:none;z-index:2}
.stage.active{display:block;animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.final{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vw,500px);padding:28px 20px 26px;text-align:center;z-index:5;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-radius:28px;box-shadow:0 20px 50px rgba(120,50,110,.3)}
#a{font-size:27px;font-weight:800;line-height:1.3;margin-bottom:10px}
#b{font-size:24px;font-weight:800;color:#d6336c;margin-bottom:18px}
#c{font-size:32px;font-weight:800;line-height:1.3}
#c b{color:#d6336c}
#layer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.heart{position:absolute;--base:min(40vw,22vh);--sz:calc(var(--base)*var(--k,1));width:var(--sz);height:calc(var(--sz)*.95);left:calc(var(--x) - var(--sz)/2);top:calc(var(--y) - var(--sz)*.475);filter:drop-shadow(0 8px 10px rgba(200,30,80,.35));opacity:0;transform:scale(.15);transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.4,.4,1);animation:drift 6s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@media (min-aspect-ratio:1/1){.heart{--base:min(26vw,36vh,260px)}}
#layer.show .heart{opacity:1;transform:none}
@keyframes drift{from{translate:0 0}to{translate:var(--dx,10px) var(--dy,-14px)}}
.hi{position:absolute;inset:0;animation:zoom 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.hb{position:absolute;inset:0;background:linear-gradient(135deg,#ff4d79,#ff9eb8,#e0245e);-webkit-clip-path:url(#hc);clip-path:url(#hc)}
.hp{position:absolute;inset:3.5%;overflow:hidden;background:#ffd1dc;-webkit-clip-path:url(#hc);clip-path:url(#hc)}
.hp img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 5.5s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes zoom{0%,100%{transform:scale(.92) rotate(var(--r,-3deg))}50%{transform:scale(1.1) rotate(calc(var(--r,-3deg)*-1))}}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.35) translate(var(--tx,3%),var(--ty,-3%))}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<clipPath id="hc" clipPathUnits="objectBoundingBox"><path d="M0.5,0.96 C0.5,0.96 0.02,0.64 0.02,0.31 C0.02,0.14 0.14,0.03 0.27,0.03 C0.37,0.03 0.45,0.09 0.5,0.18 C0.55,0.09 0.63,0.03 0.73,0.03 C0.86,0.03 0.98,0.14 0.98,0.31 C0.98,0.64 0.5,0.96 0.5,0.96 Z"/></clipPath>
</defs></svg>

<div class="screen active" id="s1">
  <div class="big">🥺</div>
  <h1 id="hi"></h1>
  <div class="msg" id="msg"></div>
  <button class="main" id="go">Continue 💔</button>
</div>

<div class="screen" id="s2">
  <div class="big">😢</div>
  <div class="q">Will you forgive me?</div>
  <div class="sub">pretty please? 🥺</div>
  <div class="row">
    <button id="yes">Yes, I forgive you 💖</button>
    <button id="no">No</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="stage" id="s3">
  <div id="layer"></div>
  <div class="final">
    <div id="a" class="line">I know you would forgive me 😌</div>
    <div id="b" class="line">cuz you love me 💖</div>
    <div id="c" class="line">I love you too,<br><b id="nm"></b> ❤️</div>
  </div>
</div>

  };
  var $ = function (id) { return document.getElementById(id); };
  var screens = [$("s1"), $("s2"), $("s3")];
  function show(i) { screens.forEach(function (s, k) { s.classList.toggle("active", k === i); }); }

  $("hi").textContent = NAME + "...";
  $("nm").textContent = NAME;

  var amb = ["💗", "💞", "💕", "🌸", "🥺"];
  setInterval(function () {
    var h = document.createElement("div");
    h.className = "bg";
    h.textContent = amb[Math.floor(Math.random() * amb.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (16 + Math.random() * 24) + "px";
    h.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(h);
    setTimeout(function () { h.remove(); }, 12500);
  }, 500);

  var chars = Array.from(TEXT), ti = 0;
  (function typeIt() {
    ti++;
    $("msg").textContent = chars.slice(0, ti).join("");
    if (ti < chars.length) setTimeout(typeIt, 40); else $("go").classList.add("on");
  })();
  $("go").addEventListener("click", function () { show(1); });

  var no = $("no"), yes = $("yes"), d = 0;
  var hints = ["Pretty please? 🥺", "I'll buy you chocolate 🍫", "I promise I won't do it again 🤞", "Look at my sad face 😢", "I'll cry... 😭", "Don't do this to me 💔", "Just one little click 🥹", "The No button is scared of you 😅"];
  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    d++;
    no.classList.add("run");
    var bw = no.offsetWidth, bh = no.offsetHeight, pad = 12;
    var maxX = window.innerWidth - bw - pad, maxY = window.innerHeight - bh - pad;
    var yr = yes.getBoundingClientRect(), x, y, t = 0;
    do {
      x = pad + Math.random() * Math.max(maxX - pad, 1);
      y = pad + Math.random() * Math.max(maxY - pad, 1);
      t++;
    } while (t < 20 && x < yr.right + 20 && x + bw > yr.left - 20 && y < yr.bottom + 20 && y + bh > yr.top - 20);
    no.style.left = x + "px";
    no.style.top = y + "px";
    no.style.transform = "scale(" + Math.max(.45, 1 - d * .07) + ")";
    yes.style.transform = "scale(" + Math.min(1 + d * .08, 1.7) + ")";
    $("hint").textContent = hints[(d - 1) % hints.length];
  }
  ["mouseenter", "touchstart", "pointerdown", "click", "focus"].forEach(function (ev) {
    no.addEventListener(ev, dodge, { passive: false });
  });
  window.addEventListener("resize", function () {
    if (no.classList.contains("run")) dodge();
    if ($("s3").classList.contains("active")) buildHearts();
  });

  var em = ["❤️", "💖", "💗", "💕", "🌹", "🌸", "🌷", "🌺", "💐", "✨", "💞", "🥰"];
  function burst(cx, cy, n) {
    var r = document.createElement("div");
    r.className = "ring";
    r.style.left = cx + "px"; r.style.top = cy + "px";
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 900);
    for (var i = 0; i < n; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = em[Math.floor(Math.random() * em.length)];
      p.style.left = cx + "px"; p.style.top = cy + "px";
      p.style.fontSize = (20 + Math.random() * 28) + "px";
      document.body.appendChild(p);
      var a = Math.random() * Math.PI * 2;
      var dist = 120 + Math.random() * Math.min(window.innerWidth, 500) * .6;
      var dx = Math.cos(a) * dist, dy = Math.sin(a) * dist - 40, rot = (Math.random() - .5) * 720;
      var an = p.animate([
        { transform: "translate(-50%,-50%) scale(.2) rotate(0deg)", opacity: 1 },
        { transform: "translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) scale(1.2) rotate(" + rot + "deg)", opacity: 1, offset: .6 },
        { transform: "translate(calc(-50% + " + dx * 1.1 + "px),calc(-50% + " + (dy + 140) + "px)) scale(.8) rotate(" + rot * 1.2 + "deg)", opacity: 0 }
      ], { duration: 1400 + Math.random() * 900, easing: "cubic-bezier(.2,.8,.3,1)" });
      (function (el) { an.onfinish = function () { el.remove(); }; })(p);
    }
  }
  function rain(ms) {
    var end = Date.now() + ms;
    var t = setInterval(function () {
      if (Date.now() > end) { clearInterval(t); return; }
      var f = document.createElement("div");
      f.className = "fall";
      f.textContent = em[Math.floor(Math.random() * em.length)];
      f.style.left = Math.random() * 100 + "vw";
      f.style.fontSize = (20 + Math.random() * 28) + "px";
      f.style.setProperty("--rot", ((Math.random() - .5) * 540) + "deg");
      f.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(f);
      setTimeout(function () { f.remove(); }, 6500);
    }, 90);
  }

  function buildHearts() {
    var layer = $("layer");
    layer.innerHTML = "";
    var set = window.innerWidth >= window.innerHeight ? LAYOUTS.landscape : LAYOUTS.portrait;
    set.forEach(function (it, i) {
      var h = document.createElement("div");
      h.className = "heart";
      h.style.setProperty("--x", it[1] + "%");
      h.style.setProperty("--y", it[2] + "%");
      h.style.setProperty("--k", it[3]);
      h.style.setProperty("--d", ((i * .43) % 2.2).toFixed(2) + "s");
      h.style.setProperty("--dx", (i % 2 ? -1 : 1) * (8 + (i * 5) % 12) + "px");
      h.style.setProperty("--dy", (i % 3 === 0 ? 14 : -14) + "px");
      h.style.transitionDelay = (i * .28).toFixed(2) + "s";
      var inner = document.createElement("div");
      inner.className = "hi";
      inner.style.setProperty("--r", (i % 2 ? 5 : -5) + "deg");
      var b = document.createElement("div"); b.className = "hb";
      var p = document.createElement("div"); p.className = "hp";
      var img = document.createElement("img");
      img.alt = "";
      img.src = PHOTOS[it[0]];
      img.style.setProperty("--tx", (i % 2 ? -4 : 4) + "%");
      img.style.setProperty("--ty", (i % 3 ? -4 : 4) + "%");
      p.appendChild(img); inner.appendChild(b); inner.appendChild(p); h.appendChild(inner);
      layer.appendChild(h);
    });
  }

  yes.addEventListener("click", function () {
    var r = yes.getBoundingClientRect();
    no.style.display = "none";
    burst(r.left + r.width / 2, r.top + r.height / 2, 46);
    setTimeout(function () { burst(window.innerWidth / 2, window.innerHeight / 2, 40); }, 250);

      show(2);
      buildHearts();
      burst(window.innerWidth / 2, window.innerHeight / 3, 50);
      rain(9000);
      setTimeout(function () { $("a").classList.add("show"); }, 200);
      setTimeout(function () { $("b").classList.add("show"); }, 1500);
      setTimeout(function () { $("c").classList.add("show"); burst(window.innerWidth / 2, window.innerHeight / 2, 40); }, 2900);
      setTimeout(function () { $("layer").classList.add("show"); }, 3600);
    }, 700);
  });
